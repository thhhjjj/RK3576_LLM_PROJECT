<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>llm_panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c1218;
      --panel: #161e28;
      --text: #e6edf3;
      --muted: #8b9aab;
      --accent: #3d9a8b;
      --bubble-user: #2a5f56;
      --bubble-asst: #1a2430;
      --danger: #e85d5d;
      --warn: #e8a04d;
      --bar: #0a0e14;
      --font: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      background:
        radial-gradient(1200px 600px at 10% -10%, #14302c 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #1a2438 0%, transparent 50%),
        var(--bg);
    }

    .top {
      flex: 0 0 auto;
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid #1e2a38;
      background: color-mix(in srgb, var(--bar) 88%, transparent);
      backdrop-filter: blur(10px);
    }

    .brand-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .brand {
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin: 0;
    }

    .brand span { color: var(--accent); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }
    .dot.on {
      background: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .dot.err { background: var(--danger); }

    .conn-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 0.5rem;
      align-items: center;
    }

    .conn-row input {
      width: 100%;
      min-width: 0;
      padding: 0.65rem 0.8rem;
      border: 1px solid #243040;
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    .conn-row input:focus {
      border-color: color-mix(in srgb, var(--accent) 60%, #243040);
    }

    button {
      font: inherit;
      font-weight: 500;
      border: 0;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-accent { background: var(--accent); color: #f4fffc; }
    .btn-accent:hover:not(:disabled) { background: #48ad9c; }
    .btn-ghost { background: var(--panel); color: var(--text); }
    .btn-ghost:hover:not(:disabled) { background: #1e2a36; }

    .hint {
      margin: 0.55rem 0 0;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .hint code {
      font-size: 0.85em;
      color: #b7c6d6;
      background: #121a22;
      padding: 0.05rem 0.3rem;
      border-radius: 4px;
    }

    .feed {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 1.1rem 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      scroll-behavior: smooth;
    }

    .sys {
      align-self: center;
      max-width: min(36rem, 92%);
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel) 55%, transparent);
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      animation: rise 0.28s ease both;
    }

    .row {
      display: flex;
      width: 100%;
      animation: rise 0.28s ease both;
    }
    .row.user { justify-content: flex-end; }
    .row.asst { justify-content: flex-start; }

    .bubble {
      max-width: min(34rem, 86%);
      padding: 0.75rem 0.95rem;
      border-radius: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.98rem;
    }
    .row.user .bubble {
      background: var(--bubble-user);
      border-bottom-right-radius: 5px;
    }
    .row.asst .bubble {
      background: var(--bubble-asst);
      border-bottom-left-radius: 5px;
    }
    .bubble.pending { color: var(--muted); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .composer {
      flex: 0 0 auto;
      padding: 0.85rem 1.25rem calc(0.95rem + env(safe-area-inset-bottom));
      border-top: 1px solid #1e2a38;
      background: var(--bar);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
      align-items: end;
    }

    .composer textarea {
      width: 100%;
      min-height: 3rem;
      max-height: 8.5rem;
      resize: none;
      padding: 0.75rem 0.9rem;
      border: 1px solid #243040;
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      line-height: 1.45;
      outline: none;
    }
    .composer textarea:focus {
      border-color: color-mix(in srgb, var(--accent) 60%, #243040);
    }

    .composer-actions {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    @media (max-width: 560px) {
      .conn-row { grid-template-columns: 1fr 1fr; }
      .conn-row input { grid-column: 1 / -1; }
      .brand-row { flex-direction: column; align-items: flex-start; gap: 0.4rem; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand-row">
      <h1 class="brand">llm_<span>panel</span></h1>
      <div class="status" title="连接状态">
        <span class="dot" id="dot"></span>
        <span id="stext">未连接</span>
      </div>
    </div>
    <div class="conn-row">
      <input id="url" spellcheck="false" autocomplete="off"
             placeholder="ws://板子IP:8765/" />
      <button class="btn-accent" id="conn" type="button">连接</button>
      <button class="btn-ghost" id="disc" type="button" disabled>断开</button>
    </div>
    <p class="hint">
      打开本页后填板子 Wi‑Fi IP，不要用地址栏打开 <code>ws://</code>。
      查 IP：<code>adb shell 'ip -4 addr show wlan0'</code>
    </p>
  </header>

  <main class="feed" id="feed" aria-live="polite"></main>

  <footer class="composer">
    <textarea id="q" rows="2" placeholder="输入问题，Enter 发送 · Shift+Enter 换行"></textarea>
    <div class="composer-actions">
      <button class="btn-accent" id="send" type="button" disabled>发送</button>
      <button class="btn-ghost" id="smoke" type="button" disabled>试问</button>
    </div>
  </footer>

  <script>
    const SMOKE = "用一句话介绍 RK3576 上的 RKNPU。";
    const KEY = "llm_panel_ws_url";
    const DEFAULT_URL = "ws://192.168.31.89:8765/";

    const feed = document.getElementById("feed");
    const urlEl = document.getElementById("url");
    const dot = document.getElementById("dot");
    const stext = document.getElementById("stext");
    const connBtn = document.getElementById("conn");
    const discBtn = document.getElementById("disc");
    const sendBtn = document.getElementById("send");
    const smokeBtn = document.getElementById("smoke");
    const qEl = document.getElementById("q");

    let ws = null;
    let streamEl = null;

    urlEl.value = localStorage.getItem(KEY) || DEFAULT_URL;

    function setStatus(kind, text) {
      dot.className = "dot" + (kind === "on" ? " on" : kind === "err" ? " err" : "");
      stext.textContent = text;
      const on = kind === "on";
      discBtn.disabled = !on;
      sendBtn.disabled = !on;
      smokeBtn.disabled = !on;
    }

    function addSys(text) {
      const el = document.createElement("div");
      el.className = "sys";
      el.textContent = text;
      feed.appendChild(el);
      feed.scrollTop = feed.scrollHeight;
      return el;
    }

    function addBubble(side, text, pending) {
      const row = document.createElement("div");
      row.className = "row " + side;
      const bubble = document.createElement("div");
      bubble.className = "bubble" + (pending ? " pending" : "");
      bubble.textContent = text || (pending ? "…" : "");
      row.appendChild(bubble);
      feed.appendChild(row);
      feed.scrollTop = feed.scrollHeight;
      return bubble;
    }

    function endStream() {
      if (!streamEl) return;
      if (!streamEl.textContent || streamEl.textContent === "…")
        streamEl.textContent = "（空）";
      streamEl.classList.remove("pending");
      streamEl = null;
    }

    function appendToken(t) {
      if (!t) return;
      if (!streamEl) streamEl = addBubble("asst", "", true);
      if (streamEl.textContent === "…") streamEl.textContent = "";
      streamEl.classList.remove("pending");
      streamEl.textContent += t;
      feed.scrollTop = feed.scrollHeight;
    }

    function connect() {
      if (ws) {
        try { ws.close(); } catch (_) {}
        ws = null;
      }
      const u = urlEl.value.trim();
      if (!u) {
        addSys("请填写 ws://板IP:8765/");
        return;
      }
      localStorage.setItem(KEY, u);
      setStatus("", "连接中…");
      addSys("正在连接 " + u);
      try {
        ws = new WebSocket(u, ["llm"]);
      } catch (e) {
        setStatus("err", "失败");
        addSys("无法创建 WebSocket");
        return;
      }
      ws.onopen = () => {
        setStatus("on", "已连接");
        addSys("已连接");
      };
      ws.onclose = (ev) => {
        endStream();
        setStatus(ev.code === 1000 ? "" : "err", "未连接");
        addSys("已断开 code=" + ev.code);
        ws = null;
      };
      ws.onerror = () => {
        setStatus("err", "错误");
        addSys("连接错误：确认 URL、同网段、板上 :8765 在听");
      };
      ws.onmessage = (ev) => {
        try {
          const j = JSON.parse(ev.data);
          if (j.type === "token") appendToken(j.text || "");
          else if (j.type === "finish") endStream();
          else if (j.type === "error") {
            endStream();
            addSys(j.text || "错误");
          } else if (j.type === "status") addSys(j.text || "status");
          else if (j.type === "connected") addSys(j.text || "connected");
          else addSys(ev.data);
        } catch (_) {
          addSys(ev.data);
        }
      };
    }

    function disconnect() {
      if (ws) ws.close();
    }

    function ask(text) {
      const q = (text || "").trim();
      if (!q) return;
      if (!ws || ws.readyState !== 1) {
        addSys("尚未连接");
        return;
      }
      endStream();
      addBubble("user", q);
      streamEl = addBubble("asst", "…", true);
      ws.send(JSON.stringify({ type: "ask", text: q }));
    }

    connBtn.onclick = connect;
    discBtn.onclick = disconnect;
    sendBtn.onclick = () => {
      ask(qEl.value);
      qEl.value = "";
      qEl.style.height = "";
    };
    smokeBtn.onclick = () => ask(SMOKE);

    qEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });
    qEl.addEventListener("input", () => {
      qEl.style.height = "auto";
      qEl.style.height = Math.min(qEl.scrollHeight, 136) + "px";
    });

    addSys("填板子 IP 后点「连接」，即可像屏上一样对话");
    setStatus("", "未连接");
  </script>
</body>
</html>
